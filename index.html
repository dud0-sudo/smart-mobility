<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>[스마트 시티 프로젝트] 4차 산업혁명 모빌리티 탐사대</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .game-container {
            width: 100%;
            max-width: 480px;
            background-color: #1e1e1e;
            border: 2px solid #d48331;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .game-header {
            background-color: #262220;
            border-bottom: 2px solid #d48331;
            padding: 18px 16px;
            text-align: center;
        }

        .game-header h1 {
            color: #f39c12;
            font-size: 1.25rem;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .game-header p {
            color: #b0b0b0;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .game-content {
            padding: 16px;
            overflow-y: auto;
            max-height: 62vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .route-banner {
            background: linear-gradient(135deg, #2c241d, #1a2327);
            border: 1px solid #f39c12;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .route-title {
            color: #f39c12;
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 8px;
        }

        .route-desc {
            font-size: 0.85rem;
            color: #d0d0d0;
            line-height: 1.5;
        }

        .briefing-box {
            background-color: #282421;
            border: 1px solid #d48331;
            border-radius: 8px;
            padding: 14px;
            line-height: 1.5;
            font-size: 0.9rem;
        }

        .briefing-title {
            color: #f39c12;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 1rem;
        }

        .encyclopedia-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .ency-card {
            background-color: #262220;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ency-card:hover {
            border-color: #f39c12;
            background-color: #332b25;
        }

        .ency-icon-box {
            width: 44px;
            height: 44px;
            background-color: #121212;
            border: 1px solid #f39c12;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .ency-card h3 {
            color: #f39c12;
            font-size: 0.9rem;
            margin-bottom: 2px;
        }

        .ency-card p {
            font-size: 0.75rem;
            color: #aaa;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background-color: #1e1e1e;
            border: 2px solid #3498db;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
        }

        .modal-header-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .modal-title {
            color: #3498db;
            font-size: 1.05rem;
            font-weight: bold;
        }

        .modal-body {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #ddd;
            margin-bottom: 16px;
        }

        .modal-close-btn {
            background-color: #3498db;
            color: #121212;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            float: right;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice-btn {
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .choice-btn.selected {
            background-color: #4a3820;
            border-color: #f39c12;
        }

        .choice-btn .icon-wrap {
            width: 40px;
            height: 40px;
            background-color: #1c1c1c;
            border: 1px solid #d48331;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .choice-btn .info-wrap {
            flex-grow: 1;
        }

        .choice-info {
            font-size: 0.75rem;
            color: #aaa;
            margin-top: 2px;
        }

        .game-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #d48331;
            padding: 14px 16px;
            background-color: #262220;
        }

        .status-text {
            font-size: 0.8rem;
            color: #888;
        }

        .action-btn {
            background-color: #d48331;
            color: #121212;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .action-btn:disabled {
            background-color: #444;
            color: #777;
            cursor: not-allowed;
        }

        .check-in-btn {
            background-color: #2ecc71;
            color: #121212;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 0.95rem;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .check-in-btn.checked {
            background-color: #27ae60;
            color: #fff;
        }

        .reason-box {
            background-color: #1a2327;
            border: 1px solid #3498db;
            border-radius: 8px;
            padding: 14px;
            font-size: 0.85rem;
            display: none;
        }

        .reason-box.active {
            display: block;
        }

        .reason-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .receipt-card {
            background-color: #262220;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
        }

        .receipt-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .card-zone-tag {
            font-size: 0.75rem;
            color: #b0b0b0;
            font-weight: bold;
        }

        .card-transport-name {
            font-size: 0.9rem;
            font-weight: bold;
            color: #f39c12;
        }

        .card-time-cost-wrap {
            font-size: 0.9rem;
            font-weight: bold;
            color: #e0e0e0;
        }

        .card-detailed-desc {
            font-size: 0.75rem;
            color: #aaaaaa;
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px dashed #444;
        }

        .receipt-summary-box {
            background-color: #282421;
            border: 2px dashed #f39c12;
            border-radius: 8px;
            padding: 14px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .summary-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .summary-label {
            font-size: 0.75rem;
            color: #b0b0b0;
        }

        .summary-value {
            font-size: 1.05rem;
            font-weight: bold;
            color: #e0e0e0;
        }

        .summary-score {
            grid-column: 1 / -1;
            background-color: #1a1714;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #f39c12;
            font-weight: bold;
        }
        .input-group select, .input-group input {
            width: 100%;
            padding: 10px;
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .text-penalty { color: #e74c3c; font-weight: bold; }
        .text-bonus { color: #3498db; font-weight: bold; }
        
        .podium-top3 {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }
        .podium-card {
            background-color: #222c32;
            border: 1px solid #3498db;
            border-radius: 6px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }
        .my-rank-banner {
            background-color: #2b241d;
            border: 2px solid #f39c12;
            border-radius: 8px;
            padding: 14px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            color: #f39c12;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="game-header">
            <h1 id="zone-title">🚀 [스마트 시티 프로젝트] 4차 산업혁명 모빌리티 탐사대</h1>
            <p id="zone-subtitle">[시작 화면] 출석 체크 및 대원 정보 입력</p>
        </div>

        <div class="game-content" id="game-content-area"></div>

        <div class="game-footer">

            localStorage.setItem("mobility_visitor_count", count + 1);

            if (!data) return { "A반": [], "B반": [], "C반": [], "D반": [] };
            return JSON.parse(data);
        }

        }

            if (e.ctrlKey && e.shiftKey && e.key === 'Backspace') {
                if (confirm("🔒 [교사 전용 비밀 기능] 모든 접속 기록과 리더보드를 초기화하시겠습니까?")) {

                }

        });

                document.getElementById("zone-title").innerText = "🚀 [스마트 시티 프로젝트] 4차 산업혁명 모빌리티 탐사대";

                            <strong>🏆 우승 조건:</strong> <strong>총 이동 시간</strong>과 <strong>총 비용</strong>(보너스/패널티 반영 합산 점수)이 <strong>가장 낮은</strong> 학생이 각 반별 1위로 우승합니다!

            } else if (currentStep === 4) {

                    cost: totalCost,
                    score: finalScore
                };

                area.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:10px;">

                            <div class="briefing-title">📋 탐사 경로 요약 및 영수증 내역</div>

                                <span class="summary-value">${totalTime}분</span>

                let records = getclassRecords();
                let exists = records[studentInfo.className].some(r => r.name === currentScoreData.name && r.score === currentScoreData.score && r.time === currentScoreData.time);

                    records[studentInfo.className].push(currentScoreData);
                    records[studentInfo.className].sort((a, b) => a.score - b.score);

            if (localStorage.getItem("mobility_checked_in") === "true") return;
            addVisitorCount();
            localStorage.setItem("mobility_checked_in", "true");
            
            document.getElementById("visitor-count-display").innerText = getVisitorCount() + "명";
            const btn = document.getElementById("check-in-btn");
            btn.className = "check-in-btn checked";
            btn.innerText = "✅ 출석체크 완료됨!";
        }

        function openModal(item) {
            document.getElementById("modal-icon-container").innerHTML = item.icon;
            document.getElementById("modal-card-title").innerText = item.name;
            document.getElementById("modal-card-desc").innerHTML = item.desc;
            document.getElementById("modal-overlay").classList.add("active");
        }

        function closeModal() {
            document.getElementById("modal-overlay").classList.remove("active");
        }

        function selectChoice(choice, btnElement) {
            document.querySelectorAll(".choice-btn").forEach(b => b.classList.remove("selected"));
            btnElement.classList.add("selected");

            selectedChoice = choice;
            
            document.getElementById("selected-icon-wrap").innerHTML = choice.icon;
            document.getElementById("selected-title").innerText = choice.name;
            
            const reasonDesc = document.getElementById("reason-desc");
            reasonDesc.innerHTML = `• <strong>기본 제원:</strong> ${choice.time} / ${choice.cost}<br>• <strong>조정 요인:</strong> ${choice.penaltyHtml}<br>• <strong>지리적·사회적 배경:</strong> ${choice.reason}`;
            
            document.getElementById("reason-box").classList.add("active");
            document.getElementById("main-action-btn").disabled = false;
        }

        function handleMainAction() {
            if (currentStep === -3) {
                const cSelect = document.getElementById("input-class");
                const nInput = document.getElementById("input-name");
                if (cSelect && nInput) {
                    studentInfo.className = cSelect.value;
                    studentInfo.studentName = nInput.value.trim() || "탐사대원";
                }
                currentStep = -2;
            } else if (currentStep === -2) {
                currentStep = -1;
            } else if (currentStep === -1) {
                currentStep = 0;
            } else if (currentStep >= 0 && currentStep < stages.length) {
                if (selectedChoice) {
                    totalScoreSummary.push(selectedChoice);
                }
                currentStep++;
            } else if (currentStep === 4) {
                currentStep = 5;
            } else {
                currentStep = -3;
                totalScoreSummary = [];
                currentScoreData = null;
                localStorage.removeItem("mobility_checked_in");
            }
            renderCurrentScreen();
        }

        renderCurrentScreen();
    </script>
